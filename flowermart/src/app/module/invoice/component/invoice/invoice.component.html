<div class="card border-light mb-3">

    <!-- Card header -->

    <div class="card-header" style="text-align: center;">
        <div class="row">
            <div class="col">
                <button type="button" class="btn btn-secondary" style="float: left;" (click)="redirect(['/'])">
                    <i class="ph ph-arrow-circle-left icon-text-button"></i>
                    Regresar
                </button>
            </div>

            <div class="col">
                <h4>Listado de Facturas</h4>
            </div>

            <div class="col">
                &nbsp;
            </div>
        </div>
    </div>

    <!-- Card body -->
    
    <div class="card-body">

        <!-- Invoice table -->

        <table class="table">
            <thead class="thead-dark">
                <tr class="table-primary">
                    <th>No.</th>
                    <th>Código</th>
                    <th>Monto total</th>
                    <th>Fecha de compra</th>
                </tr>
            </thead>

            <tbody>
                @for(invoice of invoices | paginate: pageConfig; track invoice; let i = $index) {
                    <tr>
                        <td class="tr-data">{{ i + 1 }}</td>
                        <td class="tr-data">{{ invoice.invoice_id }}</td>
                        <td class="tr-data">{{ invoice.total | currency: 'USD' }}</td>
                        <td class="tr-data">{{ invoice.created_at | date: 'dd/MM/yyyy' }}</td>
                    </tr>
                }
            </tbody>
        </table>

        <!-- Pagination controls -->

        <div class="pagination-container">
            <pagination-controls previousLabel="Anterior" nextLabel="Siguiente"
                (pageChange)="pageConfig.currentPage = $event">
            </pagination-controls>
        </div>
    </div>
</div>
